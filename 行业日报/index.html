<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="行业日报：机器人等领域每日学术与产业动态，中美前沿对比、专家争论与学习规划。">
<title>行业日报 · 每日动态</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a3e">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<div class="orbs" aria-hidden="true">
  <span class="orb orb-gold"></span>
  <span class="orb orb-rose"></span>
  <span class="orb orb-blue"></span>
</div>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-text">行业日报</span>
    </div>
    <div class="menu-label">— 行业目录 —</div>
    <nav id="industryNav"></nav>
    <button id="addIndustryBtn" class="add-btn">＋ 添加行业</button>
    <div id="addIndustryBox" class="add-box hidden">
      <input id="newIndustryInput" placeholder="输入行业名称，如：人工智能">
      <div class="add-actions">
        <button id="confirmAdd" class="primary">添加</button>
        <button id="cancelAdd">取消</button>
      </div>
    </div>
    <div class="sidebar-foot">每晚 20:00，梦境准时更新</div>
  </aside>
  <main class="content">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="pageTitle">机器人</h1>
        <p id="pageSubtitle">每日学术与产业动态 · 中美前沿对比</p>
      </div>
      <div class="topbar-actions">
        <input id="searchInput" class="search" placeholder="🔍 在梦境中搜索…">
        <button id="treeBtn" class="icon-btn" title="打开技术树">🌳</button>
        <button id="themeToggle" class="icon-btn" title="切换梦境明暗">🌙</button>
      </div>
    </header>
    <section class="stats" id="statsBar">
      <div class="stat"><span class="stat-value" id="statReports">0</span><span class="stat-label">日报篇数</span></div>
      <div class="stat"><span class="stat-value" id="statIndustries">1</span><span class="stat-label">行业数量</span></div>
      <div class="stat"><span class="stat-value" id="statDays">0</span><span class="stat-label">覆盖天数</span></div>
    </section>
    <div id="listView">
      <div id="reportList" class="report-list"></div>
    </div>
    <div id="detailView" class="detail-view hidden"></div>
    <div id="treeView" class="tree-view hidden">
      <div class="tree-topbar">
        <button id="treeBack" class="back-btn">← 返回日报</button>
        <span class="tree-title">🌳 机器人技术树 · 2016–2026</span>
        <div id="treeQuickbar" class="tree-quickbar"></div>
      </div>
      <div id="treeViewport" class="tree-viewport">
        <div id="treeWorld" class="tree-world">
          <svg id="treeSvg" class="tree-svg"></svg>
          <div id="treeNodes" class="tree-nodes"></div>
        </div>
      </div>
    </div>
    <div id="nodeModal" class="node-modal hidden">
      <div class="node-modal-card">
        <button id="nodeModalClose" class="nm-close">×</button>
        <div id="nodeModalBody"></div>
      </div>
    </div>
    <footer class="footer">行业日报 · 数据由每日周期任务自动生成 · 本站不收集任何个人信息</footer>
  </main>
</div>
<div id="toast" class="toast hidden"></div>
<script src="data/reports.js"></script>
<script src="data/tech_tree.js"></script>
<script src="app.js"></script>
<script src="tree.js"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js');});}</script>
</body>
</html>
